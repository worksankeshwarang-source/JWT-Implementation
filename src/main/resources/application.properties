spring.application.name=${APP_NAME:jwt-implementation}

server.port=${SERVER_PORT:8090}

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5480/postgres}
#spring.datasource.url=jdbc:${DB_URL:postgresql://host.docker.internal:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# JPA/Hibernate Configuration
spring.jpa.properties.hibernate.default_schema=test_schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true


#PostgreSQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
jwt.secret=${JWT_EXPIRY:MySecretKeyForTestScenarioForImplementingJWTForWorkingJWTLearning}
jwt.expiration=${JWT_EXPIRY:3600000}